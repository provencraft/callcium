name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  forge:
    name: Forge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: forge soldeer install

      - name: Run Forge fmt
        run: forge fmt --check
        id: fmt

      - name: Run Forge build
        run: forge build
        id: build

      - name: Run Forge tests
        run: forge test -vvv
        id: test

      # Last: the floor profile forces a full rebuild into the shared out directory,
      # so every step above would otherwise recompile under the ci profile.
      - name: Check floor compiler version
        run: forge build --force --skip test --skip script
        env:
          FOUNDRY_PROFILE: floor
        id: floor

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Docs consume the SDK's built dist, not its source.
      - name: Build SDK
        working-directory: packages/sdk
        run: bun run build

      - name: Check docs formatting
        working-directory: packages/docs
        run: bun run fmt:check

      # Ahead of lint and tests: this generates the MDX collections they import.
      - name: Type check docs
        working-directory: packages/docs
        run: bun run types:check

      - name: Lint docs
        working-directory: packages/docs
        run: bun run lint

      - name: Run docs tests
        working-directory: packages/docs
        run: bun run test

      - name: Build docs
        working-directory: packages/docs
        run: bun run build

  sdk:
    name: SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: packages/sdk
        run: bun install

      - name: Check formatting
        working-directory: packages/sdk
        run: bun run fmt:check

      - name: Lint
        working-directory: packages/sdk
        run: bun run lint

      - name: Type check
        working-directory: packages/sdk
        run: bun run typecheck

      - name: Build
        working-directory: packages/sdk
        run: bun run build

      - name: Run tests
        working-directory: packages/sdk
        run: bun run test
