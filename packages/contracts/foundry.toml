[profile.default]
allow_internal_expect_revert = true
auto_detect_solc = false
solc = "0.8.30"
evm_version = "cancun"
src = "src"
out = "out"
test = "test"
libs = ["lib", "dependencies"]
optimizer = true
optimizer_runs = 10_000
via_ir = true
isolate = true
ast = true
fs_permissions = [{ access = "read", path = "../../spec/vectors/" }]

# Compile-checks the library at the minimum supported compiler version.
[profile.floor]
solc = "0.8.28"
via_ir = true

[fmt]
ignore = ["src/vendor/**/*.sol"]
single_line_statement_blocks = 'single'
multiline_func_header = "all"
sort_imports = true
contract_new_lines = false
override_spacing = false
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "preserve"
wrap_comments = false

[profile.ci.fuzz]
runs = 10000

[profile.release.fuzz]
runs = 50000

[dependencies]
forge-std = "1.16.2"

[lint]
ignore = ["src/vendor/**/*.sol"]
# Rules that fire on idioms this codebase is built from; no site annotation retires them.
# Every other rule stays armed, silenced per item in src and per file in test.
exclude_lints = [
    "boolean-cst", # every predicate returning a boolean constant.
    "calls-loop", # every `new T[](n)` allocation.
    "inline-assembly", # every block, memory-safe or not.
    "internal-function-used-once", # every library export.
    "literal-instead-of-constant", # every EVM word constant.
    "require-revert-in-loop", # every validator guard.
]

[doc]
out = ".forge-doc"

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_version = false
remappings_prefix = ""
remappings_location = "txt"
