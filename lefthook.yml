# Standard `**`: it also matches files directly under a package, such as `package.json`.
glob_matcher: doublestar

pre-commit:
  commands:
    forge-fmt:
      root: "packages/contracts/"
      glob: "packages/contracts/{src,test}/**/*.sol"
      run: forge fmt --check {staged_files}

    sdk-fmt:
      root: "packages/sdk/"
      glob: "packages/sdk/**/*.{ts,json,md}"
      run: bunx oxfmt --check {staged_files}

    sdk-lint:
      root: "packages/sdk/"
      glob: "packages/sdk/**/*.ts"
      run: bunx oxlint {staged_files}

    sdk-typecheck:
      glob:
        - "packages/sdk/**/*.{ts,json}"
        - "bun.lock"
      run: bun run --cwd packages/sdk typecheck

    docs-fmt:
      root: "packages/docs/"
      glob: "packages/docs/**/*.{ts,tsx,mjs,css,json,md}"
      exclude:
        - "packages/docs/content/docs/**"
      run: bunx oxfmt --check {staged_files}

    docs-lint:
      root: "packages/docs/"
      glob: "packages/docs/**/*.{ts,tsx}"
      run: bunx oxlint {staged_files}

    docs-typecheck:
      glob:
        - "packages/docs/**/*.{ts,tsx,mjs,json}"
        - "bun.lock"
      run: bun run --cwd packages/docs typecheck

    docs-sync-solidity:
      glob:
        - "packages/contracts/src/**/*.sol"
        - "packages/contracts/foundry.toml"
        - "packages/docs/tools/sync-reference.ts"
        - "packages/docs/tools/sol-symbol-map.ts"
      run: bun run --cwd packages/docs sync:reference && git add packages/docs/content/docs/solidity/reference

    docs-sync-sdk:
      glob:
        - "packages/sdk/src/**/*.ts"
        - "packages/sdk/typedoc.json"
        - "packages/docs/tools/sync-sdk-reference.ts"
      run: bun run --cwd packages/docs sync:sdk-reference && git add packages/docs/content/docs/sdk/reference

    docs-sync-specs:
      glob:
        - "spec/**/*.md"
        - "packages/docs/tools/sync-specs.ts"
      run: bun run --cwd packages/docs sync:specs && git add "packages/docs/content/docs/(protocol)/specifications"
